name: CI

on:
  pull_request:
  # Feature branches are covered by pull_request; this catches whatever lands on main.
  push:
    branches: [main]

# Least privilege: neither job writes to the repo.
permissions:
  contents: read

# Supersede redundant runs on the same branch, but never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Jobs sharing this key may log "Failed to save: ... another job may be
      # creating this cache" — expected; check other jobs for "Cache saved with key".
      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      # Run every static check even if an earlier one failed, so one CI run reports all issues at once.
      - run: npx expo-doctor
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Jobs sharing this key may log "Failed to save: ... another job may be
      # creating this cache" — expected; check other jobs for "Cache saved with key".
      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      # A cold runner re-compiles React Native's sources on first use, which pushed the first
      # CalendarScreen test past its 5s limit. Entries are content-addressed, so the prefix
      # fallback after a lockfile bump safely reuses every file that didn't change.
      - uses: actions/cache@v6
        with:
          path: .jest-cache
          key: jest-cache-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-cache-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-
      # Same as `npm test` plus the coverage floors in package.json's jest config.
      - run: npm run test:coverage -- --cacheDirectory=.jest-cache
