name: CodeQL

on:
  pull_request:
  # Feature branches are covered by pull_request; this catches whatever lands on main.
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

# Write privilege: job uploads SARIF results to the Security tab.
permissions:
  contents: read
  security-events: write

# CodeQL runs are slower than lint/test; cancel stale ones regardless of event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same coverage as GitHub's default setup, which this workflow replaces. One language per run is
        # CodeQL's recommendation; `actions` scans the workflow files themselves.
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # Both are parsed directly; there is no build step to run.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
